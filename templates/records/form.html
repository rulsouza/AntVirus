{% extends "base.html" %}
{% block title %}{{ 'Editar' if record else 'Novo' }} registro | Meu Projeto{% endblock %}
{% block content %}
<div class="form-card card shadow-sm mx-auto"><div class="card-body p-4">
  <h1 class="h3 mb-3">{{ 'Editar' if record else 'Novo' }} registro</h1>
  <p class="text-body-secondary">Este é apenas um exemplo. Adapte os campos à sua entidade principal.</p>
  <form method="post">
    <div class="mb-3"><label class="form-label" for="title">Título</label><input class="form-control" id="title" name="title" value="{{ record['title'] if record else '' }}" required></div>
    <div class="mb-3"><label class="form-label" for="description">Descrição</label><textarea class="form-control" id="description" name="description" rows="4">{{ record['description'] if record else '' }}</textarea></div>
    <button class="btn btn-primary" type="submit">Salvar</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('records.listar_registros') }}">Cancelar</a>
  </form>
</div></div>
{% endblock %}
