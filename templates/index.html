{% extends "base.html" %}
{% block title %}Início | Meu Projeto{% endblock %}
{% block content %}
<section class="hero rounded-4 p-5 text-center shadow-sm">

  <p class="text-uppercase fw-semibold mb-2">Projeto-base Flask</p>
  <h1 class="display-5 fw-bold">Nome do seu sistema</h1>
